# docker-compose.prod.yml — stack de PRODUCCIÓN con terminación TLS (change tls-https-ec2).
#
# Autocontenido (no es un overlay): define el stack completo de producción. Se usa así:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias respecto a docker-compose.yml (dev):
#   - Se antepone `caddy` como reverse-proxy TLS; SOLO caddy publica puertos al host (80/443).
#   - `frontend` y `backend` NO publican puertos: solo son accesibles por la red interna.
#   - El acceso público es https://${PUBLIC_HOST}/  (ver caddy/Caddyfile y el runbook).
#
# ⚠️ Mantener en sync con docker-compose.yml (db/backend/frontend comparten definición
#    salvo la publicación de puertos). Los secretos viven en el .env del EC2.
services:
  # Reverse-proxy + terminación TLS
  caddy:
    image: caddy:2-alpine
    container_name: padelpro-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # <ip-con-guiones>.sslip.io en prod; localhost para validación local.
      PUBLIC_HOST: ${PUBLIC_HOST:?Define PUBLIC_HOST (p. ej. 16-192-61-61.sslip.io o localhost)}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados + estado ACME (persistente: evita rate-limit de LE)
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - padelpro-network

  # PostgreSQL 15 — Base de datos
  db:
    image: postgres:15-alpine
    container_name: padelpro-db
    environment:
      POSTGRES_DB: padelpro
      POSTGRES_USER: padelpro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padelpro_dev}
    ports:
      - "5432:5432"
    volumes:
      - padelpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padelpro"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - padelpro-network
    restart: unless-stopped

  # Backend — Spring Boot (sin publicar puerto al host: solo red interna)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padelpro-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/padelpro
      SPRING_DATASOURCE_USERNAME: padelpro
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-padelpro_dev}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: 'true'
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 3600
      JWT_REFRESH_EXPIRATION: 604800
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@padelpro.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - padelpro-network
    restart: unless-stopped

  # Frontend — React + Vite (sin publicar puerto al host: solo red interna)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: padelpro-frontend
    environment:
      # El frontend llama al backend por ruta relativa /api (mismo origen HTTPS vía
      # Caddy), por lo que VITE_API_BASE_URL no interviene; se mantiene por compat.
      VITE_API_BASE_URL: /api
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (IPv4) y NO localhost: dentro del contenedor localhost es ::1 (IPv6)
      # pero `vite preview` bindea solo IPv4 → con localhost el contenedor quedaba
      # unhealthy y Caddy (depends_on: frontend healthy) no arrancaría el TLS.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - padelpro-network
    restart: unless-stopped

networks:
  padelpro-network:
    driver: bridge

volumes:
  padelpro_postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
