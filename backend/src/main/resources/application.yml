spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/padelpro}
    username: ${DB_USER:padelpro}
    password: ${DB_PASSWORD:padelpro}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  mail:
    from: ${MAIL_FROM:no-reply@padelpro.local}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: 15
  encryption:
    key: ${ENCRYPTION_KEY}
