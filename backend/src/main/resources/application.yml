spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/padelpro}
    username: ${DB_USER:padelpro}
    password: ${DB_PASSWORD:padelpro}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  idempotency:
    # Retention window for idempotency_keys rows (ISO-8601 duration). An Idempotency-Key only guards
    # short-window retries of POST /api/reservas, so keys older than this are purged (V9 deferred-job
    # note). 24h comfortably covers legitimate client retries while capping unbounded table growth.
    ttl: ${IDEMPOTENCY_TTL:PT24H}
    purge:
      enabled: ${IDEMPOTENCY_PURGE_ENABLED:true}
  mail:
    from: ${MAIL_FROM:no-reply@padelpro.local}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: 15
  encryption:
    key: ${ENCRYPTION_KEY}
  telegram:
    # Telegram Bot API base URL. The bot token + webhook secret live (encrypted) in system_config,
    # not here (D-OTP-01). Override the base URL in tests to point at a mock server.
    api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
    # Profile URL shown to unlinked users who message the bot ("link first").
    profile-url: ${TELEGRAM_PROFILE_URL:http://localhost:5173/perfil}
  redsys:
    # TPV endpoint (sandbox by default; set the production endpoint via env in prod).
    tpv-url: ${REDSYS_TPV_URL:https://sis-t.redsys.es:25443/sis/realizarPago}
    # Public server-to-server webhook URL sent as Ds_Merchant_MerchantURL (must be reachable by Redsys).
    merchant-url: ${REDSYS_MERCHANT_URL:http://localhost:8080/api/pagos/webhook}
    # Browser return URLs (frontend PagoConfirmadoPage).
    url-ok: ${REDSYS_URL_OK:http://localhost:5173/pago/confirmado}
    url-ko: ${REDSYS_URL_KO:http://localhost:5173/pago/confirmado}
    currency: ${REDSYS_CURRENCY:978}
