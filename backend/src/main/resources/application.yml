spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/padelpro}
    username: ${DB_USER:padelpro}
    password: ${DB_PASSWORD:padelpro}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-32-chars!!}
    access-token-expiry-minutes: 15
