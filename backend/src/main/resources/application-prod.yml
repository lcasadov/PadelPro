spring:
  application:
    name: padelpro-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # SMTP (notificaciones) — credentials come from the environment (D5); never committed.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  # H-1 / OWASP A05+A07 — the app runs behind a trusted reverse proxy/gateway (Nginx, ALB…).
  # NATIVE activates Tomcat's RemoteIpValve so X-Forwarded-For is honoured ONLY for requests
  # arriving from an internal (trusted) proxy; getRemoteAddr() then returns the real client IP and
  # untrusted callers can no longer spoof it to defeat the rate limiter. RemoteIpValve's default
  # internal-proxies regex already matches RFC-1918/loopback ranges; override via the env var below
  # if the proxy sits outside those ranges.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TOMCAT_INTERNAL_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}

# Encryption
encryption:
  key: ${ENCRYPTION_KEY}

# Application-level mail settings (sender address for notificaciones)
app:
  mail:
    from: ${MAIL_FROM:no-reply@padelpro.local}
  # Account-lockout (H-1 / OWASP A07). See application.yml for the rationale.
  auth:
    lockout:
      max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:10}
      duration-minutes: ${AUTH_LOCKOUT_DURATION_MINUTES:15}

# Logging
logging:
  level:
    root: INFO
    com.padelpro: INFO
    org.springframework.security: WARN
    org.springframework: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "[%d{ISO8601}] [%p] [%c{0}] %m%n"

# Actuator (Health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
