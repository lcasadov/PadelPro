spring:
  datasource:
    # URL, username and password are injected by @DynamicPropertySource in the base test class
    url: ${spring.datasource.url}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    clean-on-validation-error: true   # Only in tests — never in production

# The mail health contributor inspects JavaMailSenderImpl beans; when a test @MockBeans the
# JavaMailSender the contributor map is empty and actuator fails to start. Disable it for ITs.
management:
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: test-secret-key-padelpro-256-bits-minimum-length-padding-here
    access-token-expiry-minutes: 15
  encryption:
    key: test-encryption-key-padelpro-256-bits-minimum-length
