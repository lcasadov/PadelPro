name: CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build y Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # ---------- Backend: Spring Boot / JDK 17 / Maven ----------
      - name: Configurar JDK 17 (Temurin) + caché Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend — build + tests (unit + IT Testcontainers + gate JaCoCo)
        run: mvn -B -f backend/pom.xml verify

      - name: Publicar informe de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      # ---------- Frontend: React + Vite / Node 20 ----------
      - name: Configurar Node 20 + caché npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Frontend — lint
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend — tests (vitest)
        working-directory: ./frontend
        run: npm run test

      - name: Frontend — build
        working-directory: ./frontend
        run: npm run build

  # ---------- E2E smoke: journey crítico en navegador real contra el stack real ----------
  e2e:
    name: E2E smoke (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    # Secretos de PRUEBA efímeros: la BD y el stack se destruyen al terminar el job.
    env:
      JWT_SECRET: e2e-ci-jwt-secret-min-32-chars-1234567890abcdef
      ENCRYPTION_KEY: e2e-ci-encryption-key-min-32-chars-1234567890
      POSTGRES_PASSWORD: e2e_ci_pw
      ADMIN_EMAIL: e2e-admin@padelpro.local
      ADMIN_PASSWORD: E2ePassw0rd!secure
      # Sin SMTP real en CI: no dejar que el health de correo marque el backend DOWN.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Levantar el stack real (frontend build + backend + postgres)
        run: docker compose up -d --build

      - name: Esperar a que el stack esté listo (backend + frontend)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1 \
               && curl -sf http://localhost:5173/ >/dev/null 2>&1; then
              echo "Stack listo tras $((i*5))s"
              exit 0
            fi
            echo "Esperando stack... intento $i/60"
            sleep 5
          done
          echo "::error::Timeout esperando el stack (backend/frontend)"
          docker compose ps
          docker compose logs --tail 120
          exit 1

      - name: Configurar Node 20 + caché npm
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: E2E — instalar dependencias
        working-directory: ./e2e
        run: npm ci

      - name: E2E — instalar navegador Chromium
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: E2E — ejecutar smoke (login → crear reserva)
        working-directory: ./e2e
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_ADMIN_EMAIL: e2e-admin@padelpro.local
          E2E_ADMIN_PASSWORD: E2ePassw0rd!secure
        run: npx playwright test

      - name: Publicar informe Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

      - name: Estado y logs del stack (si falla)
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 120

      - name: Derribar el stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Desplegar en EC2
    needs: [build-and-test, e2e]
    runs-on: ubuntu-latest
    # Solo despliega en push a develop. Los pull_request NUNCA despliegan.
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Conectar por SSH y desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/PadelPro
            git pull origin develop
            docker compose down
            docker compose up -d --build
