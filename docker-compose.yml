services:
  # PostgreSQL 15 — Base de datos
  db:
    image: postgres:15-alpine
    container_name: padelpro-db
    environment:
      POSTGRES_DB: padelpro
      POSTGRES_USER: padelpro
      # En producción el password se inyecta desde el .env del EC2 (D4).
      # Fallback solo para desarrollo local.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padelpro_dev}
    ports:
      - "5432:5432"
    volumes:
      - padelpro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padelpro"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - padelpro-network
    restart: unless-stopped

  # Backend — Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padelpro-backend
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/padelpro
      SPRING_DATASOURCE_USERNAME: padelpro
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-padelpro_dev}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: 'true'
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 3600
      JWT_REFRESH_EXPIRATION: 604800

      # Encryption (configuracion-club)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Bootstrap del primer admin (acceso-cuenta-prod, D1). Si están vacías, el runner no crea nada.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # SMTP / Email (notificaciones). Credenciales SOLO en el .env del EC2 (nunca en el repo).
      # Si MAIL_HOST está vacío, el envío falla de forma tolerante (D4) y no rompe la gestión.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@padelpro.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      # Health de correo: en prod queda activo (true). En E2E/CI sin SMTP real se pone
      # a false para que un SMTP no configurado no marque /actuator/health DOWN y bloquee
      # el arranque del frontend (depends_on: backend healthy).
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-true}

      # Spring Boot
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - padelpro-network
    restart: unless-stopped

  # Frontend — React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: padelpro-frontend
    environment:
      # El bundle se sirve como build estático (D6). Las llamadas a /api se
      # enrutan al backend vía el proxy de `vite preview` (ver vite.config.ts).
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://backend:8080}
      NODE_ENV: production
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:5173 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - padelpro-network
    restart: unless-stopped

networks:
  padelpro-network:
    driver: bridge

volumes:
  padelpro_postgres_data:
    driver: local
